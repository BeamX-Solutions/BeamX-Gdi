name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Lets `next build` run without real secrets (see src/lib/env.ts).
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Only tokens style components (spec 0003): no raw colors in src/components or src/app.
      - run: pnpm check:colors
      # Schema drift (spec 0002, AC-11). `db:check` only checks the migrations folder, so
      # regenerate from the schema: any new or changed migration file means someone edited
      # the schema without running `pnpm db:generate`. Needs no database.
      - name: Fail on schema drift
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain src/db/migrations)" ]; then
            git status --porcelain src/db/migrations
            echo "::error::The schema and the committed migrations differ. Run pnpm db:generate and commit the new migration."
            exit 1
          fi
      # Unit tests (Vitest `unit` project). Integration tests run in the database job.
      - run: pnpm test
      - run: pnpm build

  # Accessibility and layout checks on /design (spec 0003, AC-15) and the whole chat flow
  # on the scripted fake model (spec 0007, AC-12). Chromium only, against a production
  # build. ENABLE_DESIGN_PAGE must be set for BOTH build and start: Cache Components
  # renders the page at build time. The chat flow writes to a throwaway Neon branch, so
  # this job needs the same Neon settings as the database job (fork PRs are skipped).
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      ENABLE_DESIGN_PAGE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check Neon settings
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::error::Set the NEON_API_KEY secret and the NEON_PROJECT_ID variable in GitHub (Settings, Secrets and variables, Actions)."
            exit 1
          fi
      - name: Expiry for the branch (safety net if cleanup is skipped)
        id: expiry
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Create Neon branch
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ steps.expiry.outputs.at }}
      - name: Connection settings for the next steps
        run: |
          echo "DATABASE_URL=${{ steps.branch.outputs.db_url_pooled }}" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=${{ steps.branch.outputs.db_url }}" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          # Keys the sign up grant's email hash. Without it the grant is skipped, and
          # the Beacon flow (50 credits, more than a guest's starter) cannot be afforded.
          # A fresh key per run is safe: each run has its own throwaway branch.
          echo "BILLING_HASH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> "$GITHUB_ENV"
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Delete Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_id: ${{ steps.branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

  # Database integration tests on a throwaway Neon branch (spec 0002, AC-11).
  # Needs the NEON_API_KEY secret and the NEON_PROJECT_ID variable. Fork PRs get no
  # secrets, so this job is skipped for them.
  database:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check Neon settings
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::error::Set the NEON_API_KEY secret and the NEON_PROJECT_ID variable in GitHub (Settings, Secrets and variables, Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Expiry for the branch (safety net if cleanup is skipped)
        id: expiry
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Create Neon branch
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ steps.expiry.outputs.at }}
      - name: Connection settings for the next steps
        run: |
          echo "DATABASE_URL=${{ steps.branch.outputs.db_url_pooled }}" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=${{ steps.branch.outputs.db_url }}" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> "$GITHUB_ENV"
      # Migrations folder consistency (snapshot versions, collisions, journal order).
      # Drift between the schema and the migrations is caught in the check job.
      - run: pnpm db:check
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - name: Delete Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_id: ${{ steps.branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
